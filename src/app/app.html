
<div
  class="crt-app"
  [class.crt-app--closing]="transitionState === 'closing'"
  [class.crt-app--closed]="transitionState === 'closed'"
  [class.crt-app--opening]="transitionState === 'opening'">

  <div class="crt-app__content">
    <router-outlet></router-outlet>
  </div>

  <div class="crt-app__blackout" aria-hidden="true"></div>
  <div class="crt-app__flash" aria-hidden="true"></div>
  <div class="crt-app__line" aria-hidden="true"></div>
</div>
